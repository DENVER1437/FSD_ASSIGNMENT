services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nestmatch-backend
    restart: unless-stopped
    ports:
      - "5001:5000"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-production}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:8080,http://127.0.0.1:8080}
    networks:
      - nestmatch-net

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: nestmatch-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - nestmatch-net

networks:
  nestmatch-net:
    driver: bridge
