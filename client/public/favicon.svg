<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Gradient definitions for NestMatch brand teal & fresh green -->
  <defs>
    <linearGradient id="roofGrad" x1="60" y1="280" x2="380" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="120" y1="260" x2="360" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="330" y1="180" x2="410" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="studentTeal" x1="160" y1="260" x2="240" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#044e3e"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="studentGreen" x1="260" y1="260" x2="340" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Chimney -->
  <path d="M345 150V210H375V150H345Z" fill="#047857" rx="6"/>

  <!-- Leaf accent sprouting from chimney -->
  <path d="M360 155C360 155 350 90 415 65C425 125 385 160 360 155Z" fill="url(#leafGrad)"/>

  <!-- House roof structure -->
  <path d="M72 268C64 278 72 292 84 292H102V418C102 444 124 466 150 466H340C366 466 388 444 388 418V292H406C418 292 426 278 418 268L262 136C252 128 238 128 228 136L72 268Z"
        fill="none" stroke="url(#wallGrad)" stroke-width="40" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 4-Pane Attic Window -->
  <rect x="222" y="200" width="20" height="20" rx="4" fill="#a7f3d0" fill-opacity="0.8"/>
  <rect x="248" y="200" width="20" height="20" rx="4" fill="#a7f3d0" fill-opacity="0.8"/>
  <rect x="222" y="226" width="20" height="20" rx="4" fill="#a7f3d0" fill-opacity="0.8"/>
  <rect x="248" y="226" width="20" height="20" rx="4" fill="#a7f3d0" fill-opacity="0.8"/>

  <!-- Left Roommate (Teal) -->
  <circle cx="204" cy="304" r="32" fill="url(#studentTeal)"/>
  <path d="M152 428C152 368 186 352 224 366C236 386 242 414 240 436C220 440 180 438 152 428Z" fill="url(#studentTeal)"/>

  <!-- Right Roommate (Fresh Green) -->
  <circle cx="288" cy="304" r="32" fill="url(#studentGreen)"/>
  <path d="M246 436C248 406 264 368 316 366C342 376 354 402 352 430C326 440 280 440 246 436Z" fill="url(#studentGreen)"/>
</svg>